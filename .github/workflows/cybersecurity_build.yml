name: Cybersecurity manuscript build
on:
  push:
    branches: [main, cybersecurity-submission-20261015]
    paths:
      - "paper_a/venue_cybersecurity/**"
      - ".github/workflows/cybersecurity_build.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Springer Nature LaTeX package
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --output /tmp/sn-official.zip 'https://cms-resources.apps.public.k8s.springernature.io/springer-cms/rest/v1/content/18782940/data/v12'
          unzip -q /tmp/sn-official.zip -d /tmp/sn-official
          SRC_CLASS="$(find /tmp/sn-official -name sn-jnl.cls -type f | head -1)"
          SRC_BST="$(find /tmp/sn-official -name sn-basic.bst -type f | head -1)"
          test -n "$SRC_CLASS" && test -n "$SRC_BST"
          cp "$SRC_CLASS" paper_a/venue_cybersecurity/sn-jnl.cls
          cp "$SRC_BST" paper_a/venue_cybersecurity/sn-basic.bst
          echo "Official class: $SRC_CLASS"
          sha256sum paper_a/venue_cybersecurity/sn-jnl.cls paper_a/venue_cybersecurity/sn-basic.bst
      - name: Compile Springer Nature review copy
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            manuscript_review.tex
            manuscript_with_authors.tex
            title_page.tex
          working_directory: paper_a/venue_cybersecurity
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Check output and package editable sources
        run: |
          set -euo pipefail
          cd paper_a/venue_cybersecurity
          test -s manuscript_review.pdf
          test -s manuscript_with_authors.pdf
          test -s title_page.pdf
          if grep -E "(undefined references|undefined citations)" manuscript_review.log; then
            echo "Unresolved references or citations"; exit 1
          fi
          if command -v pdftotext >/dev/null; then
            pdftotext manuscript_review.pdf /tmp/cybersecurity-review.txt
            if grep -E "(Lili He|Sheng Jiang|Shuang Chen|Lei Zhang|Linghui Lyu|github.com/js110)" /tmp/cybersecurity-review.txt; then
              echo "Double-anonymous manuscript leaked identifying text"; exit 1
            fi
          fi
          # Preserve relative ../figures references for a portable ZIP extracted under paper_a/.
          cd ..
          zip -q -r venue_cybersecurity/cybersecurity_submission_sources.zip \
            venue_cybersecurity/manuscript_review.tex \
            venue_cybersecurity/manuscript_with_authors.tex \
            venue_cybersecurity/title_page.tex \
            venue_cybersecurity/sn-jnl.cls \
            venue_cybersecurity/sn-basic.bst \
            venue_cybersecurity/references.bib \
            venue_cybersecurity/translated_from_chinese \
            venue_cybersecurity/README.md \
            venue_cybersecurity/SUBMISSION_CHECKLIST.md \
            venue_cybersecurity/cover_letter_draft.md \
            venue_cybersecurity/TEMPLATE_SOURCE.txt \
            venue_cybersecurity/TRANSLATION_SOURCE.md \
            figures/system_architecture.png \
            figures/decision_counterexample.png \
            figures/protocol_sequence.png \
            figures/availability.png \
            figures/budget_tradeoff.png \
            figures/backend_costs.png \
            figures/compile_scalability.png \
            figures/receiver_diagnostic.png
      - name: Upload review PDF and editable submission sources
        uses: actions/upload-artifact@v4
        with:
          name: cybersecurity-review-pdf-and-sources
          path: |
            paper_a/venue_cybersecurity/manuscript_review.pdf
            paper_a/venue_cybersecurity/manuscript_with_authors.pdf
            paper_a/venue_cybersecurity/title_page.pdf
            paper_a/venue_cybersecurity/cybersecurity_submission_sources.zip
